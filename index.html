<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Lookup — API Practice Project</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 { font-size: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input {
    flex: 1;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    padding: 10px 16px;
    font-size: 15px;
    border: none;
    background: #333;
    color: white;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #555; }
  .locate {
    background: none;
    color: #333;
    border: 1px solid #ccc;
    font-size: 13px;
    padding: 6px 10px;
    margin-bottom: 20px;
  }
  #result {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 16px;
    min-height: 80px;
    text-align: center;
  }
  #result .temp { font-size: 36px; font-weight: bold; margin: 4px 0; }
  #result .meta { font-size: 13px; color: #777; }
  .error { color: #b00020; }
  .hint { color: #888; font-size: 13px; }
</style>
</head>
<body>

<h1>Weather lookup</h1>
<p class="hint">Enter coordinates (or use your location) to see the current weather. This uses the free <a href="https://open-meteo.com" target="_blank">Open-Meteo API</a> — no API key needed.</p>

<div class="row">
  <input type="text" id="lat-input" placeholder="Latitude" value="51.5074">
  <input type="text" id="lon-input" placeholder="Longitude" value="-0.1278">
  <button id="search-btn">Get weather</button>
</div>
<button class="locate" id="locate-btn">Use my current location</button>

<div id="result">
  <p class="hint">Weather will appear here.</p>
</div>

<script>
  const latInput = document.getElementById('lat-input');
  const lonInput = document.getElementById('lon-input');
  const button = document.getElementById('search-btn');
  const locateBtn = document.getElementById('locate-btn');
  const result = document.getElementById('result');

  // Weather codes from Open-Meteo docs, simplified to plain English
  const weatherLabels = {
    0: 'Clear sky', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast',
    45: 'Fog', 48: 'Fog', 51: 'Light drizzle', 61: 'Rain', 63: 'Rain',
    65: 'Heavy rain', 71: 'Snow', 80: 'Rain showers', 95: 'Thunderstorm'
  };

  async function getWeather() {
    const lat = latInput.value.trim();
    const lon = lonInput.value.trim();
    if (!lat || !lon) return;

    result.innerHTML = '<p class="hint">Loading...</p>';

    try {
      // Notice: this API takes parameters in the URL after "?" instead of
      // in the path itself. That's called a query string.
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

      const response = await fetch(url);
      if (!response.ok) throw new Error(`Request failed (status ${response.status})`);

      const data = await response.json();
      const current = data.current_weather;
      const label = weatherLabels[current.weathercode] || 'Unknown conditions';

      result.innerHTML = `
        <div class="temp">${current.temperature}°C</div>
        <div>${label}</div>
        <div class="meta">Wind ${current.windspeed} km/h &middot; ${lat}, ${lon}</div>
      `;
    } catch (err) {
      result.innerHTML = `<p class="error">${err.message}</p>`;
    }
  }

  function useMyLocation() {
    if (!navigator.geolocation) {
      result.innerHTML = '<p class="error">Geolocation not supported by this browser.</p>';
      return;
    }
    result.innerHTML = '<p class="hint">Finding your location...</p>';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        latInput.value = pos.coords.latitude.toFixed(4);
        lonInput.value = pos.coords.longitude.toFixed(4);
        getWeather();
      },
      () => {
        result.innerHTML = '<p class="error">Could not get your location. Enter coordinates manually.</p>';
      }
    );
  }

  button.addEventListener('click', getWeather);
  locateBtn.addEventListener('click', useMyLocation);

  // Load London by default
  getWeather();
</script>

</body>
</html>
